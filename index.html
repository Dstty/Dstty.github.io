<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dstty</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg fill='%23a6432b'%3E%3Ccircle cx='3.2' cy='3.2' r='1.6'/%3E%3Ccircle cx='12.8' cy='3.2' r='1.6'/%3E%3Ccircle cx='3.2' cy='12.8' r='1.6'/%3E%3Ccircle cx='12.8' cy='12.8' r='1.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="./theme.css">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('dstty-theme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', t || 'dark');
})();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }

  .page{
    max-width:var(--wide);
    margin:0 auto;
    padding:0 var(--pad);
  }

  /* 上下两条结构线，仅作版面边界 */
  .edge{
    height:1px;
    background:var(--line);
  }
  .edge--top{margin-top:clamp(1.6rem,4vw,3rem)}

  .stack{
    display:flex;
    flex-direction:column;
    gap:var(--gap);
    padding:var(--gap) 0;
  }
  .row{
    display:grid;
    gap:var(--gap);
  }
  .row--2{grid-template-columns:1fr 1fr}
  .row--3{grid-template-columns:repeat(3,1fr)}

  /* 空框：1px 细边 + 四角 L 型刻线 */
  .frame{
    --len:11px;
    position:relative;
    min-height:9rem;
    border:1px solid var(--line);
    border-radius:2px;
    background-color:var(--fill);
    background-image:
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner)),
      linear-gradient(var(--corner),var(--corner));
    background-repeat:no-repeat;
    background-size:
      var(--len) 1px, 1px var(--len),
      var(--len) 1px, 1px var(--len),
      var(--len) 1px, 1px var(--len),
      var(--len) 1px, 1px var(--len);
    background-position:
      left top, left top,
      right top, right top,
      left bottom, left bottom,
      right bottom, right bottom;
  }

  .frame--hero{min-height:clamp(13rem,38vh,24rem)}
  .row--2 .frame{min-height:clamp(9rem,18vh,13rem)}
  .row--3 .frame{min-height:clamp(7rem,14vh,10rem)}
  .frame--wide{min-height:clamp(6rem,10vh,8rem)}

  /* 有内容的框：左缩略图 + 右标题描述，整块可点 */
  .entry{
    display:grid;
    grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
    align-items:center;
    gap:clamp(.9rem,2.6vw,2rem);
    padding:clamp(.9rem,2.2vw,1.5rem);
    text-decoration:none;color:inherit;
    transition:border-color .25s ease,background-color .25s ease;
  }
  .entry:hover{border-color:var(--line-strong);background-color:var(--fill-2)}
  .entry__thumb{
    overflow:hidden;
    border:1px solid var(--line);border-radius:1px;
    background:var(--paper-2);
    aspect-ratio:26/16;
  }
  .entry__thumb svg{
    display:block;width:100%;height:100%;
    transition:transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .entry:hover .entry__thumb svg{transform:scale(1.03)}
  .entry__text{min-width:0}
  .entry__title{
    margin:0;
    font-family:var(--serif);font-weight:600;
    font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.1;letter-spacing:-.02em;
  }
  .entry__desc{
    margin:.7rem 0 0;
    font-size:.92rem;line-height:1.65;color:var(--ink-2);
    max-width:34ch;
  }
  @media (max-width:700px){
    .entry{grid-template-columns:1fr;align-items:start}
  }
  /* 窄卡片：图在上、文字在下 */
  .entry--tall{grid-template-columns:1fr;align-items:start}
  .entry--tall .entry__thumb{aspect-ratio:3/2}
  .entry--tall .entry__desc{max-width:none}
  .entry__title--sm{font-size:clamp(1.4rem,2.6vw,1.9rem)}

  .edge--bottom{margin-bottom:clamp(1.6rem,4vw,3rem)}

  /* 入场：轻微上浮 + 渐显 */
  html.js .frame{opacity:0;transform:translateY(10px)}
  html.js .frame.is-in{
    opacity:1;transform:none;
    transition:opacity .7s cubic-bezier(.2,.75,.2,1) var(--d,0ms),transform .7s cubic-bezier(.2,.75,.2,1) var(--d,0ms);
  }

  @media (max-width:760px){
    .row--2,.row--3{grid-template-columns:1fr}
    .row--2 .frame{min-height:clamp(7rem,14vh,10rem)}
    .row--3 .frame{min-height:clamp(5.5rem,11vh,8rem)}
    .frame--hero{min-height:clamp(10rem,30vh,16rem)}
  }
  @media (prefers-reduced-motion:reduce){
    html.js .frame,html.js .frame.is-in{opacity:1;transform:none;transition:none}
  }
</style>
</head>
<body>
<div class="page">

  <div class="edge edge--top" aria-hidden="true"></div>

  <main class="stack">

    <!-- 主视觉 / 首屏大框：四方向覆盖 -->
    <a class="frame frame--hero entry" href="./cover.html" data-slot="hero">
      <div class="entry__thumb">
        <svg viewBox="0 0 520 320" role="img" aria-label="n=10 的平铺样例，空位沿斜线排布">
          <defs>
            <pattern id="pat-cover" width="200" height="200" patternUnits="userSpaceOnUse">
              <g stroke="var(--cv-grid-soft)" stroke-width="1"><line x1="20" y1="0" x2="20" y2="200"/><line x1="40" y1="0" x2="40" y2="200"/><line x1="60" y1="0" x2="60" y2="200"/><line x1="80" y1="0" x2="80" y2="200"/><line x1="100" y1="0" x2="100" y2="200"/><line x1="120" y1="0" x2="120" y2="200"/><line x1="140" y1="0" x2="140" y2="200"/><line x1="160" y1="0" x2="160" y2="200"/><line x1="180" y1="0" x2="180" y2="200"/><line x1="0" y1="20" x2="200" y2="20"/><line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="60" x2="200" y2="60"/><line x1="0" y1="80" x2="200" y2="80"/><line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="140" x2="200" y2="140"/><line x1="0" y1="160" x2="200" y2="160"/><line x1="0" y1="180" x2="200" y2="180"/></g>
              <g fill="var(--cv-mark)"><rect x="0" y="0" width="20" height="20"/><rect x="100" y="0" width="20" height="20"/><rect x="60" y="20" width="20" height="20"/><rect x="120" y="40" width="20" height="20"/><rect x="180" y="60" width="20" height="20"/><rect x="40" y="80" width="20" height="20"/><rect x="160" y="100" width="20" height="20"/><rect x="20" y="120" width="20" height="20"/><rect x="80" y="140" width="20" height="20"/><rect x="140" y="160" width="20" height="20"/><rect x="0" y="180" width="20" height="20"/></g>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="var(--cv-bg)"/>
          <rect width="100%" height="100%" fill="url(#pat-cover)"/>
        </svg>
      </div>
      <div class="entry__text">
        <h2 class="entry__title">四方向覆盖</h2>
        <p class="entry__desc">在整数格点上放置棋子，要求横、竖、两条 45° 斜线四个方向都不出现连续 n 个棋子。目前记录了 n = 1 到 50 的晶胞与对应密度。</p>
      </div>
    </a>

    <!-- 两栏 -->
    <div class="row row--2">
      <a class="frame entry entry--tall" href="./roads.html" data-slot="col-1">
        <div class="entry__thumb">
          <svg viewBox="0 0 360 240" role="img" aria-label="4×4 四方向道路阵列">
            <rect width="100%" height="100%" fill="var(--cv-bg)"/>
            <g stroke="var(--cv-grid)" stroke-width="1" fill="none"><rect x="80" y="20" width="50" height="50"/><rect x="130" y="20" width="50" height="50"/><rect x="180" y="20" width="50" height="50"/><rect x="230" y="20" width="50" height="50"/><rect x="80" y="70" width="50" height="50"/><rect x="130" y="70" width="50" height="50"/><rect x="180" y="70" width="50" height="50"/><rect x="230" y="70" width="50" height="50"/><rect x="80" y="120" width="50" height="50"/><rect x="130" y="120" width="50" height="50"/><rect x="180" y="120" width="50" height="50"/><rect x="230" y="120" width="50" height="50"/><rect x="80" y="170" width="50" height="50"/><rect x="130" y="170" width="50" height="50"/><rect x="180" y="170" width="50" height="50"/><rect x="230" y="170" width="50" height="50"/></g>
            <g stroke="var(--cv-ink)" stroke-width="7.5" stroke-linecap="round"><line x1="155" y1="45" x2="180" y2="45"/><line x1="205" y1="45" x2="230" y2="45"/><line x1="205" y1="45" x2="180" y2="45"/><line x1="255" y1="45" x2="255" y2="70"/><line x1="255" y1="45" x2="230" y2="45"/><line x1="105" y1="95" x2="105" y2="120"/><line x1="155" y1="95" x2="180" y2="95"/><line x1="155" y1="95" x2="155" y2="120"/><line x1="205" y1="95" x2="180" y2="95"/><line x1="255" y1="95" x2="255" y2="70"/><line x1="255" y1="95" x2="255" y2="120"/><line x1="105" y1="145" x2="105" y2="120"/><line x1="105" y1="145" x2="130" y2="145"/><line x1="105" y1="145" x2="105" y2="170"/><line x1="155" y1="145" x2="155" y2="120"/><line x1="155" y1="145" x2="180" y2="145"/><line x1="155" y1="145" x2="155" y2="170"/><line x1="155" y1="145" x2="130" y2="145"/><line x1="205" y1="145" x2="230" y2="145"/><line x1="205" y1="145" x2="205" y2="170"/><line x1="205" y1="145" x2="180" y2="145"/><line x1="255" y1="145" x2="255" y2="120"/><line x1="255" y1="145" x2="255" y2="170"/><line x1="255" y1="145" x2="230" y2="145"/><line x1="105" y1="195" x2="105" y2="170"/><line x1="155" y1="195" x2="155" y2="170"/><line x1="155" y1="195" x2="180" y2="195"/><line x1="205" y1="195" x2="205" y2="170"/><line x1="205" y1="195" x2="230" y2="195"/><line x1="205" y1="195" x2="180" y2="195"/><line x1="255" y1="195" x2="255" y2="170"/><line x1="255" y1="195" x2="230" y2="195"/></g>
          </svg>
        </div>
        <div class="entry__text">
          <h2 class="entry__title entry__title--sm">道路阵列</h2>
          <p class="entry__desc">四种构造：4×4、16×16、64 格正六边形、9×9 双色。每个都让全部状态恰好出现一次，并保持道路全连通。</p>
        </div>
      </a>
      <div class="frame" data-slot="col-2"></div>
    </div>

    <!-- 三栏 -->
    <div class="row row--3">
      <div class="frame" data-slot="cell-1"></div>
      <div class="frame" data-slot="cell-2"></div>
      <div class="frame" data-slot="cell-3"></div>
    </div>

    <!-- 通栏收尾 -->
    <div class="frame frame--wide" data-slot="wide"></div>

  </main>

  <div class="edge edge--bottom" aria-hidden="true"></div>

</div>

<button class="theme-btn" id="themeBtn" type="button" aria-label="切换主题">☀</button>

<script>
(function(){
  var root = document.documentElement;
  root.classList.add('js');

  var frames = document.querySelectorAll('.frame');
  var show = function(el){ el.classList.add('is-in'); };

  if (!('IntersectionObserver' in window)) {
    frames.forEach(show);
    return;
  }

  // 首屏内的框直接依次出场，其余滚动进入时再显示
  frames.forEach(function(el, i){
    if (i < 3) { el.style.setProperty('--d', (i * 90) + 'ms'); show(el); }
  });

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { show(e.target); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });
  frames.forEach(function(el){ io.observe(el); });
})();
</script>
<script>
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var KEY = 'dstty-theme';
  function paint(t){
    root.setAttribute('data-theme', t);
    if (btn) {
      btn.textContent = t === 'dark' ? '☀' : '☾';
      btn.setAttribute('aria-label', t === 'dark' ? '切到亮色' : '切到暗色');
    }
    if (typeof window.dsttyThemeChanged === 'function') window.dsttyThemeChanged();
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  paint(saved || 'dark');
  if (btn) btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    paint(next);
  });
})();
</script>
</body>
</html>
